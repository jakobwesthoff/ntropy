name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  # A release ships only from a commit that passes the same checks as CI.
  # Tag pushes do not trigger ci.yml on their own, so the release calls it,
  # and nothing is published until it succeeds.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # The release notes are the tag's section of the changelog; a tag
          # without one fails the release instead of publishing it bare.
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          # macOS targets
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

          # Linux targets (statically linked)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ntropy
          target: ${{ matrix.target }}
          archive: ntropy-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
