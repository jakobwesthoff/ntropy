name: Release

# Each job grants its token only what that job needs. The called CI reads;
# only the two release jobs can write.
permissions: {}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

jobs:
  # A release ships only from a commit that passes the same checks as CI.
  # Tag pushes do not trigger ci.yml on their own, so the release calls it,
  # and nothing is published until it succeeds.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release actions call gh with the explicit token below and run
      # no git command that needs credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          # The release notes are the tag's section of the changelog; a tag
          # without one fails the release instead of publishing it bare.
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          # macOS targets
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

          # Linux targets (statically linked)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ntropy
          target: ${{ matrix.target }}
          archive: ntropy-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
