name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The release workflow runs these checks before it publishes anything.
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # rust-toolchain has no versioned releases. Its only tag, v1, marks
      # a commit on master, so updating this pin may need a manual bump.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just check
      # The documentation vault under docs/website must export cleanly
      # with the binary this commit builds; the project page is that
      # export.
      - run: just website

  # The browser-side files under src/site/dist/ are committed; this job
  # rebuilds them from site/ with Bun and fails on any difference, then runs
  # the frontend's own checks (ADR 0051).
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/.bun-version
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - run: just site-check
