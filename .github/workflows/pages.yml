# Deploys the project page: the documentation vault under docs/website,
# exported as a static site by the latest released ntropy binary. Runs
# when the vault changes on main and after every release, since a
# release is what brings the exporter the vault may rely on.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/website/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # A failed release deploys nothing.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # After a release, the page is the documentation of that release:
      # the vault at the tagged commit. Otherwise the pushed main.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # The exporter is the newest release, so the page always renders
      # with a binary users can install.
      - name: Download the latest ntropy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*-x86_64-unknown-linux-musl.tar.gz' --output ntropy.tar.gz
          tar xzf ntropy.tar.gz
          ./ntropy --version

      - name: Export the site
        run: ./ntropy --vault docs/website -n site -o dist --strict

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
