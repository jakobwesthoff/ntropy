# Deploys the project page: the documentation vault under docs/website,
# exported as a static site by the latest released ntropy binary.

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The exporter is the newest release, so the page always renders
      # with a binary users can install.
      - name: Download the latest ntropy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '*-x86_64-unknown-linux-musl.tar.gz' --output ntropy.tar.gz
          tar xzf ntropy.tar.gz
          ./ntropy --version

      - name: Export the site
        run: ./ntropy --vault docs/website -n site -o dist --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
