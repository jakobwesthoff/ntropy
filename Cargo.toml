[package]
name = "ntropy"
version = "1.11.0"
edition = "2024"
authors = ["Jakob Westhoff <jakob@westhoffswelt.de>"]
description = "An opinionated Markdown note-taking and management CLI."
homepage = "http://westhoffswelt.de"
repository = "https://github.com/jakobwesthoff/ntropy"
license = "MPL-2.0"

[features]
default = ["encryption"]
# Vault encryption at rest (ADR 0041). Building without it drops the crypto and
# credential-store trees; the command surface stays compiled either way and
# reports the missing support at runtime, so `--help` is identical in both
# builds. The store crates are target-gated, so naming them all here costs
# nothing on a platform none of them apply to.
encryption = [
    "dep:age",
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
    "dep:linux-keyutils-keyring-store",
]

[dependencies]
# `armor` is the only feature needed: the ASCII-armored wrap of the vault
# identity. X25519 and the scrypt passphrase recipient are in age's core, and
# leaving the rest off keeps the ssh, plugin and CLI machinery out of the tree.
age = { version = "0.12.1", default-features = false, features = [
    "armor",
], optional = true }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ignore = "0.4.28"
jiff = "0.2.32"
keyring-core = { version = "1.0.0", optional = true }
linkify = "0.11.0"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
nucleo = "0.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.0"
regex-syntax = "0.8.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
ulid = "3.0.0"
unicode-width = "0.2.2"

[dev-dependencies]
assert_fs = "1.1.4"
insta = { version = "1.48.0", features = ["filters"] }
insta-cmd = "0.7.0"
typst-syntax = "0.15.0"

# Leaner distributed binary: thin LTO trims size with a modest compile cost,
# and stripping symbols shrinks it further. Runtime stays at the default
# release opt-level 3 (ADR 0020's soft performance target needs no more).
[profile.release]
lto = true
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.186"

# Credential stores are named individually rather than through the `keyring`
# facade, which hardcodes one store per platform and offers no fallback. The
# design calls for the kernel keyring where no Secret Service daemon is running,
# and `keyring`'s own documentation points applications that need to choose
# their stores at `keyring-core` plus the stores they want.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", features = [
    "keychain",
], optional = true }

# The Secret Service client is the zbus one, which is pure Rust. Its
# `dbus-secret-service` sibling would build a vendored libdbus from C source.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
linux-keyutils-keyring-store = { version = "1.0.0", optional = true }
# `rt-async-io-crypto-rust` picks the runtime and the crypto backend the
# Secret Service client needs. Without a runtime feature it refuses to compile
# at all; `async-io` uses zbus's own reactor rather than pulling in tokio, and
# `crypto-rust` keeps the session encryption pure Rust instead of linking
# OpenSSL.
zbus-secret-service-keyring-store = { version = "1.0.0", features = [
    "rt-async-io-crypto-rust",
], optional = true }
