[package]
name = "ntropy"
version = "1.8.0"
edition = "2024"
authors = ["Jakob Westhoff <jakob@westhoffswelt.de>"]
description = "An opinionated Markdown note-taking and management CLI."
homepage = "http://westhoffswelt.de"
repository = "https://github.com/jakobwesthoff/ntropy"
license = "MPL-2.0"

[features]
default = ["encryption"]
# Vault encryption at rest (ADR 0041). Building without it drops the `age` and
# `keyring` trees; the command surface stays compiled either way and reports
# the missing support at runtime, so `--help` is identical in both builds.
encryption = ["dep:age", "dep:keyring"]

[dependencies]
# `armor` is the only feature needed: the ASCII-armored wrap of the vault
# identity. X25519 and the scrypt passphrase recipient are in age's core, and
# leaving the rest off keeps the ssh, plugin and CLI machinery out of the tree.
age = { version = "0.12.1", default-features = false, features = ["armor"], optional = true }
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
ignore = "0.4.28"
jiff = "0.2.32"
# Default features cover the macOS Keychain and the pure-Rust zbus Secret
# Service client; the kernel keyring is added for headless Linux. The `cli`
# feature is deliberately absent: it pulls `dbus-secret-service`, which builds
# a vendored libdbus from C source.
keyring = { version = "4.1.6", features = ["linux-keyutils-keyring-store"], optional = true }
linkify = "0.11.0"
lsp-server = "0.8.0"
lsp-types = "0.97.0"
nucleo = "0.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.0"
regex-syntax = "0.8.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
ulid = "1.2.1"
unicode-width = "0.2.2"

[dev-dependencies]
assert_fs = "1.1.4"
insta = { version = "1.48.0", features = ["filters"] }
insta-cmd = "0.7.0"
typst-syntax = "0.15.0"

# Leaner distributed binary: thin LTO trims size with a modest compile cost,
# and stripping symbols shrinks it further. Runtime stays at the default
# release opt-level 3 (ADR 0020's soft performance target needs no more).
[profile.release]
lto = true
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.186"
